{{- if .Values.services.worker.enabled }}
{{- $svc := .Values.services.worker -}}
{{- $scaling := default (dict) $svc.scaling -}}
{{- $minReplicas := int (default 1 $scaling.min) -}}
{{- $vpaManagesReplicas := default true (index (.Values.vpa | default dict) "managesReplicas") -}}
{{- $secretEnv := fromYaml (include "fabricate.mergedAppSecretEnv" .) -}}
{{- $_ := include "fabricate.validateRequiredEnv" (dict "service" "worker" "env" $secretEnv "required" (list "FABRICATE_PDF_SOCKET_PATH" "FABRICATE_DATABASE_HOST" "FABRICATE_DATABASE_PORT" "FABRICATE_DATABASE_NAME" "FABRICATE_DATABASE_USERNAME" "FABRICATE_DATABASE_PASSWORD" "FABRICATE_REDIS_URL" "FABRICATE_REDIS_PASSWORD" "SECRET_KEY_BASE")) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabricate.workloadName" (dict "root" . "suffix" "worker") }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
{{- if not $vpaManagesReplicas }}
  replicas: {{ $minReplicas }}
{{- end }}
  {{- include "fabricate.deploymentStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "fabricate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        fabricate.ai/env-secret-checksum: {{ include "fabricate.envSecretChecksum" . | quote }}
      labels:
        {{- include "fabricate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "fabricate.workloadServiceAccountName" . | nindent 6 }}
      {{- with include "fabricate.serviceNodeSelector" (dict "svc" $svc) | trim }}{{- . | nindent 6 }}{{- end }}
      {{- with include "fabricate.podColocation" . | trim }}{{- . | nindent 6 }}{{- end }}
      {{- with include "fabricate.podTolerations" . | trim }}{{- . | nindent 6 }}{{- end }}
      {{- with include "fabricate.imagePodPullSecrets" . | trim }}{{- . | nindent 6 }}{{- end }}
      {{- with include "fabricate.initContainers" (dict "root" . "svc" $svc "mounts" (required "services.worker.mounts is required" $svc.mounts)) | trim }}{{- . | nindent 6 }}{{- end }}
      {{- include "fabricate.sharedAppVolumesSecurityContext" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ required "services.worker.image is required" $svc.image | quote }}
          imagePullPolicy: {{ include "fabricate.serviceImagePullPolicy" (dict "root" . "svc" $svc) }}
          {{- with include "fabricate.appContainerPtraceCapability" . | trim }}{{- . | nindent 10 }}{{- end }}
          command:
            {{- toYaml (required "services.worker.command is required" $svc.command) | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "fabricate.sharedSecretName" . | quote }}
          {{- with include "fabricate.containerResources" (dict "svc" $svc) | trim }}{{- . | nindent 10 }}{{- end }}
          volumeMounts:
            {{- include "fabricate.volumeMounts" (dict "mounts" (required "services.worker.mounts is required" $svc.mounts)) | trim | nindent 12 }}
      volumes:
        {{- include "fabricate.podVolumes" (dict "root" . "mounts" (required "services.worker.mounts is required" $svc.mounts)) | trim | nindent 8 }}
{{- end }}
