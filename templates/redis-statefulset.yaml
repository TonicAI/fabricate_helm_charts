{{- if .Values.services.redis.enabled }}
{{- $svc := .Values.services.redis -}}
{{- $scaling := default (dict) $svc.scaling -}}
{{- $redisPort := include "fabricate.redis.port" . | int -}}
{{- $replicas := int (default 1 $scaling.min) -}}
{{- $secretEnv := fromYaml (include "fabricate.mergedAppSecretEnv" .) -}}
{{- $_ := include "fabricate.validateRequiredEnv" (dict "service" "redis" "env" $secretEnv "required" (list "REDIS_PASSWORD")) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fabricate.workloadName" (dict "root" . "suffix" "redis") }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "fabricate.redis.svc" . }}
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "fabricate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      annotations:
        fabricate.ai/env-secret-checksum: {{ include "fabricate.envSecretChecksum" . | quote }}
      labels:
        {{- include "fabricate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- include "fabricate.workloadServiceAccountName" . | nindent 6 }}
      {{- include "fabricate.serviceNodeSelector" (dict "svc" $svc) | nindent 6 }}
      {{- include "fabricate.podTolerations" . | nindent 6 }}
      {{- include "fabricate.imagePodPullSecrets" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ required "services.redis.image is required" $svc.image | quote }}
          imagePullPolicy: {{ include "fabricate.serviceImagePullPolicy" (dict "root" . "svc" $svc) }}
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: {{ $redisPort }}
          envFrom:
            - secretRef:
                name: {{ include "fabricate.sharedSecretName" . | quote }}
          {{- include "fabricate.containerResources" (dict "svc" $svc) | nindent 10 }}
{{- end }}
