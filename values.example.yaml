# =========================================================
# IDENTITY
# =========================================================
# App name and environment is used for resource naming,
# e.g.: fabricate-prod-web, fabricate-dev-web, etc.
# =========================================================
app: fabricate
environment: prod

# =========================================================
# PRIVATE CONTAINER REGISTRY (e.g. quay.io)
# =========================================================
# When create is true and host, username, password are set, the chart creates Secret type
# kubernetes.io/dockerconfigjson named <app>-<environment>-registry (e.g. fabricate-prod-registry),
# with .dockerconfigjson (Docker auths: host, username, password, base64 auth).
# If create is false or values are empty, the chart pulls them from secrets manager.
# Prefer passing password only at deploy time: --set-string registry.password=... or TF_VAR_fabricate_registry_password
registry:
  create: true
  host: quay.io
  username: ""
  password: ""

# =========================================================
# Application environment (Kubernetes Secret stringData)
# =========================================================
# Rendered to Secret <app>-<environment>-env (e.g. fabricate-prod-env); every pod reads it as environment variables.
# With in-cluster postgresql / redis enabled, the chart always sets the database / redis host, port and URL itself.
# Keys left "" are omitted. Required keys (database, redis, SECRET_KEY_BASE)
# that are still empty make the chart fail at render time. Do not commit real secrets here.
# =========================================================
env:
  # ---------------------------------------------------
  # Security Settings
  # ---------------------------------------------------
  # Required. Generated by Terraform (random_password) when deploying with terraform/. Otherwise set your own random
  # long secret (at least 64 chars), e.g. --set-string env.SECRET_KEY_BASE=$(openssl rand -hex 64). Keep it stable
  # across upgrades: changing it invalidates sessions and encrypted data.
  SECRET_KEY_BASE: ""

  # ---------------------------------------------------
  # General Settings
  # ---------------------------------------------------
  # Empty: on install/upgrade against a live cluster, the chart sets FABRICATE_HOST to "<Ingress LB IP>.nip.io"
  # from this release's Ingress status (GCE/ALB/nginx) when unset.
  FABRICATE_HOST: "" # e.g. fabricate.example.com
  FABRICATE_PROTOCOL: "http" # HTTP/HTTPS listener protocol
  FABRICATE_PORT: 3000 # HTTP listener port
  FABRICATE_LOG_LEVEL: "warn" # Log level (default is warn)
  # Host path outside the image /fabricate tree avoids PD/ext4 mounts nested under overlay (Docker-ish layout).
  # Directory where Fabricate stores generated datasets. Must match services.web.mounts / services.worker.mounts for the
  # data volume below.
  FABRICATE_DATA_DIR: "/mnt/fabricate/data"

  # ---------------------------------------------------
  # Organization and Admin email settings
  # ---------------------------------------------------
  # This user receives access to the Admin Console after signing up.
  FABRICATE_ADMIN_EMAIL: "" # e.g. admin@fabricate.example.com
  # Name of the default account all users are assigned to.
  FABRICATE_ORGANIZATION_NAME: "My Company"

  # ---------------------------------------------------
  # Email Settings
  # ---------------------------------------------------
  FABRICATE_MAIL_ADDRESS: "" # SMTP server hostname, e.g. email-smtp.us-west-2.amazonaws.com (AWS SES) or smtp.gmail.com
  FABRICATE_MAIL_PORT: "587" # SMTP port (typically 587 for TLS, 465 for SSL)
  FABRICATE_MAIL_USER_NAME: "" # SMTP username
  FABRICATE_MAIL_PASSWORD: "" # SMTP password
  FABRICATE_MAIL_FROM: "no-reply@fabricate.example.com" # From address of outgoing email

  # ---------------------------------------------------
  # PostgreSQL Database Settings
  # ---------------------------------------------------
  # When deployed with terraform/aws, Terraform provisions Amazon RDS (PostgreSQL) and sets FABRICATE_DATABASE_HOST / PORT /
  # NAME / USERNAME / PASSWORD to it (services.postgresql.enabled: false). On GCP, terraform/gcp uses the in-cluster
  # PostgreSQL instead.
  # When services.postgresql.enabled is true, the chart sets host/port/credentials to the in-cluster Service (e.g. fabricate-prod-postgresql).
  # When false and not using Terraform, set FABRICATE_DATABASE_HOST (and related fields) to your external Postgres.
  # ---------------------------------------------------
  # FABRICATE_DATABASE_NAME: "fabricate"
  # FABRICATE_DATABASE_USERNAME: "fabricate"
  # FABRICATE_DATABASE_PASSWORD: ""                  # generated by Terraform
  # FABRICATE_DATABASE_HOST: "fabricate-prod-postgresql"
  # FABRICATE_DATABASE_PORT: "5432"                  # chart default
  # FABRICATE_DB_POOL_SIZE: "50"                     # database connection pool size, chart default

  # ---------------------------------------------------
  # Redis Database Settings
  # ---------------------------------------------------
  # When deployed with terraform/aws, Terraform provisions Amazon ElastiCache (Redis, TLS) and sets FABRICATE_REDIS_URL /
  # FABRICATE_REDIS_PASSWORD to it (services.redis.enabled: false). On GCP, terraform/gcp uses the in-cluster Redis instead.
  # When services.redis.enabled is true, the chart sets URL/password to the in-cluster Service (e.g. fabricate-prod-redis).
  # When false and not using Terraform, set FABRICATE_REDIS_URL to your external Redis.
  # ---------------------------------------------------
  # FABRICATE_REDIS_PASSWORD: ""                     # generated by Terraform
  # FABRICATE_REDIS_URL: "redis://:<password>@fabricate-prod-redis:6379"

  # ---------------------------------------------------
  # PDF Sidecar
  # ---------------------------------------------------
  # Web and worker reach the sidecar over TCP. While services.sidecar.enabled is true, the chart sets these two
  # automatically to the sidecar Service name and services.sidecar.ports.http, so leave them unset. Uncomment only to
  # point at an external sidecar (and set services.sidecar.enabled: false).
  # FABRICATE_PDF_HOST: "fabricate-prod-sidecar"
  # FABRICATE_PDF_PORT: "3100"
  # FABRICATE_PDF_RENDER_TIMEOUT_MS: "30000" # Timeout in milliseconds for PDF rendering (default is 30000)

  # ---------------------------------------------------
  # Trusted CA certificates (e.g. TLS-inspecting firewall)
  # ---------------------------------------------------
  # Optional. Mount a PEM CA bundle with additional trusted certs (e.g. one presented by an L7/TLS-inspecting firewall)
  # into web/worker and point this at it. Fabricate combines it with its OS trust store for all HTTPS/TLS traffic.
  # FABRICATE_CA_CERT_FILE: "/custom-ca.crt"

  # ---------------------------------------------------
  # Cloud Storage (ActiveStorage for generated files)
  # ---------------------------------------------------
  FABRICATE_STORAGE_SERVICE: "amazon" # amazon | azure | google ("local" needs a /fabricate/storage volume, which the chart no longer mounts)
  # On AWS, Terraform also sets FABRICATE_S3_BUCKET / FABRICATE_AWS_REGION (IAM role, no keys).

  # ---------------------------------------------------
  # Amazon S3 Example Settings (if FABRICATE_STORAGE_SERVICE="amazon")
  # ---------------------------------------------------
  # FABRICATE_S3_BUCKET: "fabricate" # S3 bucket name
  # FABRICATE_AWS_REGION: "us-east-1" # Also used when the Claude LLM provider is Amazon Bedrock
  # FABRICATE_AWS_ACCESS_KEY_ID: "" # Either set the keys or assign an IAM role to the nodes / service account
  # FABRICATE_AWS_SECRET_ACCESS_KEY: ""

  # ---------------------------------------------------
  # Azure Block Storage Settings (if FABRICATE_STORAGE_SERVICE="azure")
  # ---------------------------------------------------
  # FABRICATE_AZURE_STORAGE_ACCOUNT_NAME: "" # Name of the Azure storage account
  # FABRICATE_AZURE_STORAGE_ACCESS_KEY: "" # Access key for the Azure account
  # FABRICATE_AZURE_STORAGE_CONTAINER: "" # Path to the Azure storage container to use

  # ---------------------------------------------------
  # Google Cloud Storage Settings (if FABRICATE_STORAGE_SERVICE="google")
  # ---------------------------------------------------
  # FABRICATE_GCS_PROJECT: "" # Name of the Google Cloud Storage project to use
  # FABRICATE_GCS_CREDENTIALS: "" # Credentials to connect to the project
  # FABRICATE_GCS_BUCKET: "" # Name of the Google Cloud Storage bucket to use

  # Optional - signature version for Amazon S3-compatible services. Unset (default) uses v4 (AWS4-HMAC-SHA256), which
  # works with Amazon S3 and most modern S3-compatible services; "2" is only for older ones that do not support v4.
  # FABRICATE_S3_SIGNATURE_VERSION: "2"
  # FABRICATE_AWS_ENDPOINT: "" # Optional - endpoint of an Amazon S3-compatible service
  # FABRICATE_S3_FORCE_PATH_STYLE: "true" # Optional - path-style addressing for services not fully S3 compatible

  # ---------------------------------------------------
  # Sign-in options
  # ---------------------------------------------------
  # Optional - set to allow users to sign in through GitHub
  # GITHUB_CLIENT_ID: "" # GitHub OAuth app client ID
  # GITHUB_CLIENT_SECRET: "" # GitHub OAuth app client secret
  # Optional - set to allow users to sign in through Google
  # GOOGLE_CLIENT_ID: "" # Google OAuth 2.0 client ID
  # GOOGLE_CLIENT_SECRET: "" # Google OAuth 2.0 client secret
  # Optional - set to allow users to sign in through Microsoft Entra ID (previously Azure)
  # AZURE_CLIENT_ID: "" # Microsoft Entra ID application (client) ID
  # AZURE_CLIENT_SECRET: "" # Microsoft Entra ID client secret
  # AZURE_TENANT_ID: "" # Microsoft Entra ID tenant ID

  # ---------------------------------------------------
  # LLM provider for Claude
  # ---------------------------------------------------
  # Set if you're using Amazon Bedrock (also uses FABRICATE_AWS_REGION)
  # FABRICATE_BEDROCK_REGION: ""     # model ID region prefix, e.g. us.anthropic.claude-<model> (default: global, enables cross-region inference)
  # FABRICATE_BEDROCK_API_KEY: ""    # API key for Amazon Bedrock
  # Set if you're using Anthropic (or any compatible provider/proxy)
  # FABRICATE_ANTHROPIC_BASE_URL: "" # base URL of the API endpoint (default: https://api.anthropic.com)
  # FABRICATE_ANTHROPIC_API_KEY: ""  # API key for Anthropic
  # Set if you're using OpenAI (or any compatible provider/proxy)
  # FABRICATE_OPENAI_BASE_URL: ""    # base URL of the API endpoint (default: https://api.openai.com/v1)
  # FABRICATE_OPENAI_API_KEY: ""     # API key for OpenAI
  # Set if you're using Azure AI Foundry
  # FABRICATE_AZURE_URI: ""          # base URL of the Azure AI Foundry Anthropic-compatible endpoint
  # FABRICATE_AZURE_API_KEY: ""      # API key for the Azure AI Foundry endpoint
  # Set if you're using Google Gemini Enterprise Agent Platform (formerly Vertex AI)
  # FABRICATE_VERTEXAI_PROJECT_ID: ""                # required; falls back to GOOGLE_CLOUD_PROJECT
  # FABRICATE_VERTEXAI_GOOGLE_CLOUD_LOCATION: ""     # required; falls back to GOOGLE_CLOUD_LOCATION
  # FABRICATE_VERTEXAI_SERVICE_ACCOUNT_KEY: ""       # service account JSON key; falls back to VERTEXAI_SERVICE_ACCOUNT_KEY

  # ---------------------------------------------------
  # LLM provider for rule-based AI functions
  # ---------------------------------------------------
  # FABRICATE_LLM_PROVIDER: "openai"  # LLM provider for rule-based AI functions: openai | azure | ollama
  # FABRICATE_LLM_URI: ""             # base URI of the API endpoint
  # FABRICATE_LLM_API_KEY: ""         # API key for the selected provider
  # FABRICATE_LLM_API_VERSION: ""     # Azure OpenAI API version (only if provider is azure)
  # FABRICATE_LLM_TEXT_GEN_CONCURRENCY: "10" # max concurrent LLM requests for text generation (default 10)

  # ---------------------------------------------------
  # Sidekiq worker concurrency
  # ---------------------------------------------------
  # FABRICATE_SIDEKIQ_CONCURRENCY: "50" # max concurrent Sidekiq workers; must be lower than FABRICATE_DB_POOL_SIZE

# =========================================================
# SERVICES
# =========================================================
# Optional per-workload resources: services.<name>.cpu and .memory as { min, max } (min → requests, max → limits).
# Omit a bound with auto or 0; omit the whole resources block when nothing is set. Scalars still work as requests-only (min).
# Optional: services.<name>.nodeSelector — non-empty map is applied to that workload's pod spec.
# Optional: services.<name>.pullPolicy — container imagePullPolicy (Always | IfNotPresent | Never); default IfNotPresent. If omitted, Helm value imagePullPolicy (--set) applies when set, else IfNotPresent.
services:
  # Application container with REST API and web console
  web:
    enabled: true
    image: quay.io/tonicai/fabricate:4.36.1-af95be0f55e0
    pullPolicy: IfNotPresent
    # ClusterIP | LoadBalancer | NodePort — default ClusterIP
    type: ClusterIP

    # Per-service overrides only; the global env above applies to web and worker. (Do not copy it here with a YAML
    # anchor: service env wins over global env, so overrides such as Terraform fabricate_env would be ignored.)
    env: {}

    ports:
      http: 3000

    # RollingUpdate parameters (deployStrategy: RollingUpdate). maxSurge 1 / maxUnavailable 0 starts the new pod before
    # the old one stops, but needs all pods on one node with RWO volumes (podColocation.enabled). Terraform (aws) sets it.
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }

    mounts:
      - name: data
        path: /mnt/fabricate/data

      # Optional: Mount local storage volume only when not using S3-compatible storage
      # - name: storage
      #   path: /fabricate/storage

    cpu:
      min: 200m
      max: 2000m
    memory:
      min: 512Mi
      max: 8Gi

    nodeSelector: {}

  # Background jobs processor
  worker:
    enabled: true
    image: quay.io/tonicai/fabricate:4.36.1-af95be0f55e0
    pullPolicy: IfNotPresent

    # Per-service overrides only; the global env above applies to web and worker. (Do not copy it here with a YAML
    # anchor: service env wins over global env, so overrides such as Terraform fabricate_env would be ignored.)
    env: {}

    mounts:
      - name: data
        path: /mnt/fabricate/data

      # Optional: Mount local storage volume only when not using S3-compatible storage
      # - name: storage
      #   path: /fabricate/storage

    cpu:
      min: 200m
      max: 2000m
    memory:
      min: 512Mi
      max: 8Gi

    nodeSelector: {}

  # PDF generation sidecar (container image is still the HTML-to-PDF sidecar)
  sidecar:
    enabled: true
    image: quay.io/tonicai/fabricate-html-to-pdf-sidecar:4.36.1-af95be0f55e0
    pullPolicy: IfNotPresent

    # Listens on TCP; web and worker reach it at <sidecar Service>:<port> (set automatically as
    # FABRICATE_PDF_HOST / FABRICATE_PDF_PORT). NetworkPolicy limits it to web/worker pods.
    ports:
      http: 3100

    # Extra container env only (not shared with web/worker)
    env: {}

    cpu:
      min: 200m
      max: 2000m
    memory:
      min: 512Mi
      max: 8Gi

    nodeSelector: {}

  # Requests drive scheduling (limits stay higher for burst). Defaults suit small nodes / EKS Auto Mode;
  # raise min if you have capacity headroom.
  postgresql:
    # false (default): nothing is deployed; set env.FABRICATE_DATABASE_HOST/PORT/NAME/USERNAME/PASSWORD to an
    # external database (e.g. AWS RDS — wired automatically by terraform/aws).
    # true: deploy in-cluster PostgreSQL (StatefulSet, Service, PVC, NetworkPolicy) and point the app at it.
    enabled: false
    image: postgres:16
    pullPolicy: IfNotPresent

    env:
      # Don't put real secrets here — use non-empty overrides only via -f / --set
      # or pass them via Terraform (fabricate_env:FABRICATE_DATABASE_USERNAME, FABRICATE_DATABASE_PASSWORD, etc.).
      POSTGRES_USER: ""
      POSTGRES_DB: ""
      POSTGRES_PASSWORD: ""

    mounts:
      - name: postgresql
        path: /var/lib/postgresql/data

    cpu:
      min: 200m
      max: 2000m
    memory:
      min: 512Mi
      max: 8Gi

    nodeSelector: {}

  redis:
    # false (default): nothing is deployed; set env.FABRICATE_REDIS_URL to an external Redis
    # (e.g. AWS ElastiCache — wired automatically by terraform/aws).
    # true: deploy in-cluster Redis (StatefulSet, Service, NetworkPolicy) and point the app at it.
    enabled: false
    image: redis:7.4.8
    pullPolicy: IfNotPresent
    command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\""]

    env:
      # Don't put real secrets here — use non-empty overrides only via -f / --set
      # or pass them via Terraform (fabricate_env:FABRICATE_REDIS_PASSWORD).
      REDIS_PASSWORD: ""
      REDIS_PORT: 6379

    cpu:
      min: 200m
      max: 1000m
    memory:
      min: 512Mi
      max: 4Gi

    nodeSelector: {}

# =========================================================
# VOLUMES (PVC DEFINITIONS)
# =========================================================
# storageClass: omit meaning — leave "" to drop storageClassName on the PVC and use the cluster default
# StorageClass. On AWS with this repo's Terraform (aws/), the default class is `gp3` using the EKS Auto Mode
# EBS driver (provisioner ebs.csi.eks.amazonaws.com), not ebs.csi.aws.com. Set storageClass: gp3 to pin it;
# on GKE use "" or your PD-based class.
#
# Optional per-volume accessModes (list of strings). Omit to default to ReadWriteOnce.
# Example for Filestore CSI (NFS) when multiple nodes must mount the same claim:
#   data:
#     size: 100Gi
#     storageClass: "filestore-enterprise-rwx-multishare-rwx"
#     accessModes: [ReadWriteMany]
#
# volumesProvisioning.delayedBindingStorageClass — terraform/gcp & terraform/aws modules enable this
# with provisioner/parameters by default via helm_extra_values. Uses volumeBindingMode: WaitForFirstConsumer
# so sibling RWO claims share one zone instead of Immediate binding pinning each PVC to mismatched AZs,
# which shows as Pod pending: "didn't match PersistentVolume's node affinity" / "didn't find available persistent volumes".
volumesProvisioning:
  delayedBindingStorageClass:
    enabled: false
    # Empty → `<fabricate.prefix>-wffc` (cluster-scoped; release-specific name).
    name: ""
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    # Example GCP: pd.csi.storage.gke.io | Example AWS (EKS Auto Mode): ebs.csi.eks.amazonaws.com (not ebs.csi.aws.com)
    provisioner: ""
    # Example GCP PD CSI: { type: pd-balanced } | AWS EBS: { type: gp3, encrypted: "true" }
    parameters: {}

volumes:
  postgresql:
    size: 10Gi
    storageClass: ""

  data:
    size: 32Gi
    storageClass: ""

  # Optional: Use only when S3 is not available and FABRICATE_STORAGE_SERVICE: "local" is set. 
  # To use it, also uncomment the commented "storage" mount under services.web.mounts and services.worker.mounts.
  # storage:
  #   size: 32Gi
  #   storageClass: ""

# =========================================================
# VOLUME SECURITY (pod mounts for the shared data PVC: web / worker)
# =========================================================
# fsGroup: kubelet applies group ownership on mounts (non-root + RWO).
# initChown: root initContainer that chowns PVC paths before the app starts.
#   Enable on EKS — the EBS CSI driver (ebs.csi.eks.amazonaws.com) does not implement
#   VOLUME_MOUNT_GROUP so EBS volumes mount root-owned and fsGroup alone is not enough.
#   Leave disabled on GKE Autopilot — Autopilot blocks runAsUser: 0 / DAC_OVERRIDE, and
#   the GKE PD CSI driver properly implements VOLUME_MOUNT_GROUP so fsGroup is sufficient.
volumesSecurity:
  fsGroup: 1000
  sysptrace: true
  # seLinuxLevel: SELinux MCS level applied to web and worker so they can share the RWO volumes. On SELinux
  # nodes (Bottlerocket / EKS Auto Mode) each pod otherwise gets a random category pair and the volumes are labeled for
  # the first pod that mounts them; the others get "Permission denied" even when file ownership is correct.
  # Empty = do not set (non-SELinux nodes). Terraform (aws) sets it. Example: "s0:c100,c200".
  seLinuxLevel: ""
  initChown:
    enabled: false
    image: busybox:1.36
    uid: 1000
    gid: 1000

# =========================================================
# INGRESS (install a controller in the cluster separately; not part of this chart)
# provider selects default annotations: nginx (ingress-nginx), gce (GKE L7), alb (EKS ALB), custom (you supply annotations)
# Terraform root merges ingress.provider/class based on var.cloud (gcp→gce, aws→alb); override with fabricate_ingress.
ingress:
  enabled: true
  provider: nginx # nginx | gce | alb | custom
  class: "" # empty → default from provider (nginx / gce / alb)
  host: ""
  labels: {}
  annotations: {}
  certManager:
    clusterIssuer: ""
  tls:
    enabled: false
    secretName: ""

# =========================================================
# NETWORK POLICIES (networking.k8s.io/v1)
# =========================================================
# When enabled, the chart installs allow-list NetworkPolicies for in-cluster dependencies (PostgreSQL, Redis,
# sidecar). Set false if your CNI does not enforce NetworkPolicy or policies block legitimate traffic.
networkPolicy:
  enabled: true

# =========================================================
# SERVICE ACCOUNT (web, worker, sidecar, postgresql, redis pods)
# =========================================================
# create: render a dedicated ServiceAccount; name: explicit metadata.name (empty → <prefix>-sa, e.g. fabricate-prod-sa).
# create: false uses name if set, otherwise the namespace default account.
serviceAccount:
  create: true
  annotations: {}
  name: ""

# =========================================================
# DEPLOY STRATEGY (web, worker, sidecar Deployments)
# =========================================================
# spec.strategy.type applied to all three Deployments. RollingUpdate (default) replaces pods one at a time (chart uses
# maxSurge: 0, maxUnavailable: 1, so no spare capacity is needed). With ReadWriteOnce volumes on a multi-node cluster a
# new pod could land on another node and fail to attach them: enable podColocation or set Recreate, which terminates
# old pods before scheduling new ones.
deployStrategy: RollingUpdate

# =========================================================
# POD CO-LOCATION (web / worker)
# =========================================================
# web and worker share the ReadWriteOnce data volume, which an EBS-style disk can attach to
# only one node at a time. enabled: true adds a required podAffinity (same node) so the pods always move together
# when a node is replaced. Enabled by default. Set false for ReadWriteMany volumes or a single-node cluster you manage yourself.
podColocation:
  enabled: true

# =========================================================
# NODE TOLERATIONS (all workloads: web / worker / sidecar / postgresql / redis)
# =========================================================
# GKE Standard **Arm** pools (t2a / c4a / n4a) taint every node:
#   kubernetes.io/arch=arm64:NoSchedule
# Pods without that toleration stay Pending ("untolerated taint(s)"). Harmless on untainted amd64 pools.
# No kubernetes.io/arch nodeSelector is set, so pods schedule onto both amd64 and arm64 nodes (images must be
# multi-arch). To pin one architecture, set services.<name>.nodeSelector: {kubernetes.io/arch: arm64|amd64}.
# Other taints (Spot, GPU, dedicated): append entries; discover with:
#   kubectl get nodes -o custom-columns='NAME:.metadata.name,TAINTS:.spec.taints'
tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule

# =========================================================
# ADDITIONAL RESOURCES
# =========================================================
# Extra manifests rendered with the release. Each item is a string (rendered with tpl, Helm templating allowed) or a
# map. Empty by default. Terraform sets this for the cloud it provisions (e.g. on EKS Auto Mode: the NodePool,
# IngressClassParams and IngressClass). Example:
# additionalResources:
#   - |
#     apiVersion: networking.k8s.io/v1
#     kind: IngressClass
#     metadata:
#       name: nginx
#     spec:
#       controller: k8s.io/ingress-nginx
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata: { name: extra }
#     data: { key: value }
additionalResources: []


# =========================================================
# LABELS
# =========================================================
# When non-empty, adds key=value labels to all manifests (not just Deployment.metadata.labels).
# Set this to {} if you do not want any labels on the release.
allLabels: {}

# =========================================================
# ANNOTATIONS
# =========================================================
# When non-empty, adds key: value annotations to every resource's metadata and to pod templates (web, worker, sidecar,
# postgresql, redis). Resource-specific annotations (ingress.annotations, serviceAccount.annotations) win on conflict.
allAnnotations: {}
