{{- $envOut := fromYaml (include "fabricate.mergedAppSecretEnv" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fabricate.sharedSecretName" . }}
  {{- with include "fabricate.annotations" (dict "root" $ "extra" dict) }}
  {{- . | nindent 2 }}
  {{- end }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-env
type: Opaque
stringData:
  {{- range $k, $v := $envOut }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
