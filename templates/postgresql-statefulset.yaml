{{- if .Values.services.postgresql.enabled }}
{{- $svc := .Values.services.postgresql -}}
{{- $scaling := default (dict) $svc.scaling -}}
{{- $pgPort := include "fabricate.postgresql.port" . | int -}}
{{- $replicas := int (default 1 $scaling.min) -}}
{{- $secretEnv := fromYaml (include "fabricate.mergedAppSecretEnv" .) -}}
{{- $_ := include "fabricate.validateRequiredEnv" (dict "service" "postgresql" "env" $secretEnv "required" (list "POSTGRES_USER" "POSTGRES_DB" "POSTGRES_PASSWORD")) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fabricate.workloadName" (dict "root" . "suffix" "postgresql") }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "fabricate.postgresql.svc" . }}
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "fabricate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      annotations:
        fabricate.ai/env-secret-checksum: {{ include "fabricate.envSecretChecksum" . | quote }}
      labels:
        {{- include "fabricate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- include "fabricate.workloadServiceAccountName" . | nindent 6 }}
      {{- include "fabricate.serviceNodeSelector" (dict "svc" $svc) | nindent 6 }}
      {{- include "fabricate.podTolerations" . | nindent 6 }}
      {{- include "fabricate.imagePodPullSecrets" . | nindent 6 }}
      containers:
        - name: postgresql
          image: {{ required "services.postgresql.image is required" $svc.image | quote }}
          imagePullPolicy: {{ include "fabricate.serviceImagePullPolicy" (dict "root" . "svc" $svc) }}
          ports:
            - name: postgresql
              containerPort: {{ $pgPort }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "fabricate.sharedSecretName" . | quote }}
          {{- include "fabricate.containerResources" (dict "svc" $svc) | nindent 10 }}
          volumeMounts:
            {{- include "fabricate.volumeMounts" (dict "mounts" (required "services.postgresql.mounts is required" $svc.mounts)) | nindent 12 }}
      volumes:
        {{- include "fabricate.podVolumes" (dict "root" . "mounts" (required "services.postgresql.mounts is required" $svc.mounts)) | nindent 8 }}
{{- end }}
