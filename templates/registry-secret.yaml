{{- $rp := .Values.registry | default dict -}}
{{- $create := default false (index $rp "create") -}}
{{- $host := trim (default "" (index $rp "host")) -}}
{{- $user := default "" (index $rp "username") -}}
{{- $pass := default "" (index $rp "password") -}}
{{- /* Secret from an earlier deploy of this release: kept (not removed by Helm) when credentials are no longer in values. */ -}}
{{- $prev := lookup "v1" "Secret" .Release.Namespace (include "fabricate.defaultRegistrySecretName" .) -}}
{{- $prevJson := "" -}}
{{- if and $prev (eq (default "" (index (default (dict) $prev.metadata.annotations) "meta.helm.sh/release-name")) .Release.Name) -}}
{{- $prevJson = default "" (index (default (dict) $prev.data) ".dockerconfigjson") -}}
{{- end -}}
{{- if and $create $host $user $pass }}
{{- $auth := printf "%s:%s" $user $pass | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fabricate.defaultRegistrySecretName" . }}
  {{- with include "fabricate.annotations" (dict "root" $ "extra" dict) }}
  {{- . | nindent 2 }}
  {{- end }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict $host (dict "username" $user "password" $pass "auth" $auth)) | toJson | quote }}
{{- else if and $create $prevJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fabricate.defaultRegistrySecretName" . }}
  {{- with include "fabricate.annotations" (dict "root" $ "extra" dict) }}
  {{- . | nindent 2 }}
  {{- end }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $prevJson | quote }}
{{- end }}
