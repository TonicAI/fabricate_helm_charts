{{- if default false (index (.Values.serviceAccount | default dict) "create") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fabricate.serviceAccountName" . }}
  labels:
    {{- include "fabricate.labels" . | nindent 4 }}
  {{- $ann := index (.Values.serviceAccount | default dict) "annotations" | default dict -}}
  {{- with include "fabricate.annotations" (dict "root" $ "extra" $ann) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
